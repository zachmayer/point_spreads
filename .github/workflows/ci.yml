name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # https://docs.zizmor.sh
      # Audits every workflow in the repo and dependabot.yml for security
      # flaws. The action pins zizmor itself, so new rules arrive only with a
      # Dependabot bump, which merges only once they pass.
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          min-severity: medium
          advanced-security: false
          annotations: true

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          
      - name: Setup UV
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      
      - name: Install dependencies
        run: make install-ci

      - name: Run checks
        run: make check

      - name: Run tests
        run: make test

  # Dependabot's PRs merge themselves. This job checks nothing out, so the PR's
  # code never runs with this write token, and --match-head-commit refuses a
  # head that moved after this run saw it.
  merge-dependabot:
    needs: [build]
    # Only someone with write access can push to Dependabot's branch, and they
    # can push to main anyway. Accepted: reopening a closed Dependabot PR, which
    # Triage allows, gets it merged once the checks pass.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}

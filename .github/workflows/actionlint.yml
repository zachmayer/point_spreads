name: Actionlint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: raven-actions/actionlint@v2.2.0
